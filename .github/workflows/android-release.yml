name: Release PocketLedger APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Decode private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret' && exit 1)
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/pocketledger-release.jks
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_FILE: pocketledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.js
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: pocketledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PocketLedger ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk

name: Build signed PocketLedger SMS-import APK (no inbox permission)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-sms-build.yml'
      - 'App.js'
      - 'src/import/smsPaste.js'
      - 'src/import/smsParser.js'
permissions:
  contents: read
jobs:
  build-sms-import-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64 secret' && exit 1)
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/pocketledger-release.jks
          test -s android/app/pocketledger-release.jks
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_FILE: pocketledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.js
      - name: Build signed private SMS-import APK
        env:
          ANDROID_KEYSTORE_FILE: pocketledger-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Verify signature and absence of restricted SMS permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS|RECEIVE_MMS|SEND_SMS)' /tmp/apk-permissions.txt; then echo 'Restricted SMS permission found'; exit 1; fi
      - name: Upload signed private SMS-import APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-v0.1.0-private-sms-import-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

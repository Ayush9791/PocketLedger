name: Android build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Compile debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify debug APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

name: Android build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Diagnose Expo autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json
          node -e 'const d=require("/tmp/expo-autolinking.json"); const ms=d.modules||d; console.log(JSON.stringify(ms.map((m,i)=>({index:i,name:m.name,projects:(m.projects||[]).map(p=>({name:p.name,publication:p.publication}))})),null,2))'
      - name: Compile debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify debug APK has no SMS permission
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee /tmp/debug-permissions.txt
          if grep -q "android.permission.READ_SMS" /tmp/debug-permissions.txt; then echo "Unexpected READ_SMS permission in standard debug APK"; exit 1; fi
